name: dynamic_app_icon_changer
description: A Flutter plugin for changing app icons dynamically at runtime on Android and iOS.
version: 0.0.2
homepage: https://github.com/srkstudios/dynamic_app_icon_changer

environment:
  sdk: ^3.0.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.srkstudios.dynamic_app_icon_changer
        pluginClass: DynamicAppIconChangerPlugin
      ios:
        pluginClass: DynamicAppIconChangerPlugin
